# PR Review Agent. `cp .env.example .env`, fill it in, then `docker compose up --build`.
# nginx is the ONLY service that publishes a port. Everything else is `expose`-only.
#
# Langfuse runs as its own compose project (infra/langfuse.sh) and is reached from the api via
# the host (host.docker.internal:3000) — see README "Tracing with Langfuse".

name: pr-review-agent

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile   # owned by the frontend workstream (Next.js standalone, :3000)
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET:?set AUTH_BRIDGE_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # Server-to-server only: the token exchange never goes through nginx.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - app
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Compose-internal addresses override anything in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      # Addresses that containers on the `app` network are allocated from (see ip_range
      # below). The network gateway 172.28.0.1 — which published-port traffic can appear to
      # come from — is deliberately OUTSIDE this range, so a client cannot become "trusted".
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.1.0/24}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
    expose:
      - "8000"
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop provides it natively).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:
