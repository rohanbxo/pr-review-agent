# nginx — the only service that publishes a port.
#
#   /            -> frontend:3000  (Next.js; this includes Auth.js at /api/auth/*)
#   /api/auth/*  -> frontend:3000  (Auth.js — see "PATH COLLISION" below), 10 r/m per IP
#   /api/*       -> api:8000 with the /api prefix stripped, 30 r/s per IP
#
# PATH COLLISION: Auth.js v5 owns /api/auth/* (signin, callback, session, csrf, signout) inside
# Next.js. FastAPI also has routes under /auth/* (POST /auth/github/exchange, GET /auth/me),
# which would be /api/auth/* after prefix stripping. Resolution: every /api/auth/* request goes
# to Next.js, and FastAPI's /auth/* routes are NOT reachable through nginx at all.
#   - /auth/github/exchange is server-to-server by design (SPEC non-negotiable 2): the Next.js
#     server calls http://api:8000/auth/github/exchange over the internal compose network with
#     the bridge secret. Not exposing it removes a public attack surface for free.
#   - /auth/me is called by the Next.js server with session.apiToken (API_INTERNAL_URL); a
#     browser that wants it goes through a Next.js route handler.
# Do not "fix" this by adding a FastAPI exception inside /api/auth/ — that re-opens the
# exchange endpoint to the internet.
#
# TWO RATE-LIMIT LAYERS: these zones count requests per client IP per nginx instance. They
# protect the process from floods. They are the wrong unit for cost: LLM spend and the GitHub
# App's quota are consumed per review, per user, and are limited in the API (Redis, keyed on
# user id — see backend/app/ratelimit.py).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" rid=$request_id '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Docker's embedded DNS. Upstreams are resolved at request time through variables, so
    # nginx starts (and `nginx -t` passes) before the api/frontend containers exist, and a
    # restarted container's new IP is picked up within `valid`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # NOTE: limit_req_zone state is per nginx instance (shared memory in ONE process group).
    # Run two nginx containers and each client gets two independent budgets. The app-layer
    # limits in Redis do not have this problem.
    #
    # $binary_remote_addr is the TCP peer of nginx. nginx is the edge, so it does not read
    # X-Forwarded-For. Caveat: on Docker Desktop, published-port traffic can arrive SNAT'd from
    # one gateway address, collapsing all clients into one bucket.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 1m;

        # Security headers safe over plain HTTP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;
        # The API echoes the same id back; hide it so responses carry the header once.
        proxy_hide_header X-Request-ID;

        # HSTS is deliberately OFF. Sent over plain HTTP it pins localhost to HTTPS in the
        # browser (for max-age), breaking every other local project on :80. Enable it only in
        # the 443 block below, once TLS actually terminates at nginx.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        set $frontend_upstream http://frontend:3000;
        set $api_upstream      http://api:8000;

        # Headers for every proxied request. X-Forwarded-For APPENDS the peer address; the API
        # only believes it because nginx's address is in TRUSTED_PROXIES, and walks it right to
        # left, so a client-supplied X-Forwarded-For cannot choose the logged IP.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Reviews run for tens of seconds; don't buffer streamed responses.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;

        # Auth.js (Next.js). ^~ makes this win over the /api/ prefix below.
        # This is the spec's 10 r/m auth limit. It covers the OAuth callback
        # (/api/auth/callback/github), the request that triggers the server-to-server token
        # exchange. The frontend starts sign-in with a server action on /signin and reads the
        # session server-side, so a normal sign-in spends ONE request here; burst=20 leaves room
        # for retries and signout. Verified: round trip unthrottled, 21st rapid callback -> 429.
        location ^~ /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass $frontend_upstream;
        }

        # FastAPI, prefix stripped: /api/reviews -> /reviews.
        location ^~ /api/ {
            limit_req zone=general burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
        }

        location = /api {
            return 308 /api/;
        }

        # Next.js (pages, /_next/static assets).
        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass $frontend_upstream;
        }
    }

    # Langfuse UI (operator tool). langfuse-web publishes no port; it joins the app network via
    # infra/langfuse.override.yml. Browsers resolve *.localhost to loopback, so this needs no
    # extra port and cannot collide with Next.js dev on :3000. 502 until Langfuse is started.
    server {
        listen 80;
        server_name langfuse.localhost;

        client_max_body_size 10m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        set $langfuse_upstream http://langfuse-web:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;

        location / {
            limit_req zone=general burst=100 nodelay;
            proxy_pass $langfuse_upstream;
        }
    }

    # TLS is out of scope (SPEC). Kept here, commented, so enabling it is a config change, not a
    # design change. Uncomment only when certificates are mounted and TLS terminates here; then
    # turn the :80 server into a redirect and enable HSTS in THIS block only.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ...same locations as the :80 server above...
    # }
}
